name: Android apps

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: android-app
        run: |
          APP_VERSION="${GITHUB_REF_NAME#android-v}"
          gradle assembleCustomerDebug assembleRiderDebug \
            -PreleaseVersion="$APP_VERSION" \
            -PreleaseVersionCode="$GITHUB_RUN_NUMBER"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/customer/debug/app-customer-debug.apk ao-logistics-customer.apk
          cp android-app/app/build/outputs/apk/rider/debug/app-rider-debug.apk ao-logistics-rider.apk
          gh release create "$GITHUB_REF_NAME" ao-logistics-customer.apk ao-logistics-rider.apk \
            --title "A&M Logistics Android $GITHUB_REF_NAME" \
            --generate-notes
