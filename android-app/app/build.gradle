plugins {
    id "com.android.application"
}

android {
    namespace "com.aom.logistics"
    compileSdk 35

    defaultConfig {
        applicationId "com.aom.logistics"
        minSdk 23
        targetSdk 34
        versionCode = (project.findProperty("releaseVersionCode") ?: "1").toString().toInteger()
        versionName = (project.findProperty("releaseVersion") ?: "1.0.0").toString()
    }

    flavorDimensions "portal"
    productFlavors {
        customer {
            dimension "portal"
        }
        rider {
            dimension "portal"
            applicationId "com.aom.logistics.rider"
        }
    }
}
